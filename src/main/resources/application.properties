spring.application.name=loyalty-platform-api

# Rodando local: lê as variáveis do arquivo .env (fora do Git), se ele existir
spring.config.import=optional:file:.env[.properties]

# Render e Railway informam a porta pela variável PORT
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
# Atrás do proxy do Render/Railway: usa X-Forwarded-Proto para montar o Location com https
server.forward-headers-strategy=framework

# Banco Oracle: as credenciais vêm SEMPRE de variáveis de ambiente (nunca no código)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O Oracle da FIAP limita as sessões por aluno: pool pequeno
spring.datasource.hikari.pool-name=LoyaltyPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# Token de acesso (JWT HS256). Em produção, JWT_SECRET é obrigatório e precisa ter 32+ caracteres
loyalty.jwt.secret=${JWT_SECRET:loyalty-platform-chave-local-de-desenvolvimento}
loyalty.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}

# Origens liberadas no CorsFilter (separadas por vírgula; * vale para subdomínios)
loyalty.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:4173,https://*.vercel.app}

# Fuso usado para "hoje" (data de cadastro, validação de datas de campanha)
loyalty.fuso-horario=America/Sao_Paulo
